# Phase 2: Game Play Training
# Goal: Model can win games against random opponent
#
# Prerequisite: Phase 1 complete (high legality rate)
# Uses sparse game-end reward + small legality bonus

model = "meta-llama/Llama-3.2-3B-Instruct"  # Or checkpoint from Phase 1
max_steps = 1000
batch_size = 128
rollouts_per_example = 4

[sampling]
max_tokens = 128
temperature = 0.7

[[env]]
id = "apullin/chess"
args = { rubric = "combined", max_moves = 100, include_legal_moves = true }

# Success criteria:
# - Win rate vs random: 0% → 50%+
# - Average game length should decrease (faster wins)
# - Illegal move rate during games: <5%
