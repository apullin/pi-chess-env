# Phase 1: Legal Move Training
# Goal: Take model from ~20-40% legality to 90%+
#
# This trains on single positions - model just needs to output one legal move.
# Fast feedback loop, clear signal.

model = "meta-llama/Llama-3.2-3B-Instruct"  # Best legality baseline from benchmarks
max_steps = 500
batch_size = 256
rollouts_per_example = 8

[sampling]
max_tokens = 128  # Chess moves are short
temperature = 0.7

[[env]]
id = "apullin/chess"
args = { rubric = "legality", max_moves = 1, include_legal_moves = true }

# Success criteria:
# - Legality rate: baseline → 90%+
# - Format compliance: maintain or improve
# - Evaluate every 50 steps
