[project]
name = "chess-env"
version = "0.2.0"
description = "AlphaZero-style chess environment for RL training with Prime Intellect integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Andrew Pullin" }
]
keywords = ["chess", "reinforcement-learning", "alphazero", "prime-intellect", "gymnasium"]
tags = ["chess", "game", "rl", "alphazero", "mcts", "self-play"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Board Games",
]

dependencies = [
    "python-chess>=1.999",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "stable-baselines3>=2.7.1",
    "tqdm>=4.67.1",
    "rich>=14.2.0",
    "sb3-contrib>=2.7.1",
    "ollama>=0.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
pi = [
    "verifiers>=0.1.9.post2",
    "prime",
]
train = [
    "tensorboard>=2.14.0",
    "wandb>=0.15.0",
    "tqdm>=4.65.0",
]
llm = [
    "ollama>=0.3.0",
    "openai>=1.0.0",  # For vLLM OpenAI-compatible API
]

[project.urls]
Repository = "https://github.com/andrewpullin/chess-env"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["chess_env/**/*.py", "pyproject.toml", "README.md"]
exclude = [".venv/", "venv/", "__pycache__/", "*.pyc", "checkpoints/", "*.pt", "*.zip", "wandb/", "runs/", ".git/", "dist/", "build/", "*.egg-info/"]

[tool.hatch.build.targets.wheel]
packages = ["chess_env"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
